name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Ban screenshot payloads in crash logs
        shell: bash
        run: |
          set -euo pipefail
          pattern='(Timber|Log)\.(e|wtf)\([^)]*(screenshot|bitmap|jpeg|png|base64|imageBytes|image/jpeg|image/png)'
          if grep -RInE --include='*.kt' "$pattern" app/src android-runtime/src core/src; then
            echo "::error title=Screenshot payload log guard::Crash/error logs must not include screenshot, bitmap, encoded image, or base64 payloads."
            exit 1
          fi

      - name: Capability manifest sync
        run: ./gradlew verifyCapabilityDocs --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Detekt
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew tasks --all --console=plain | grep -Eq '(^|:)(detekt|detektMain|detektDebug)( |$)'; then
            ./gradlew detekt --stacktrace
          else
            echo "::warning title=Detekt not configured::No Gradle detekt task exists yet; this CI gate will start running automatically once the plugin lands."
          fi

      - name: Release build
        run: ./gradlew :app:assembleRelease --stacktrace

  dependency-review:
    name: Dependency vulnerability scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
