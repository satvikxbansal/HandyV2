<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Handy — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0c; font-family: 'Inter', sans-serif; }
  * { box-sizing: border-box; }
  @keyframes handy-spin { to { transform: rotate(360deg); } }
  @keyframes handy-pulse {
    0% { transform: scale(0.9); opacity: 0.9; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  @keyframes handy-wave {
    0% { height: 4px; }
    100% { height: 18px; }
  }
  @keyframes handy-pulse-dot {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/handy-primitives.jsx"></script>
<script type="text/babel" src="components/handy-backdrops.jsx"></script>
<script type="text/babel" src="components/handy-widget.jsx"></script>
<script type="text/babel" src="components/handy-overlay.jsx"></script>
<script type="text/babel" src="components/handy-fullapp.jsx"></script>
<script type="text/babel" src="components/handy-settings.jsx"></script>
<script type="text/babel" src="components/handy-permissions.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "handSize": 22,
  "titleSize": 18,
  "subtitleSize": 13,
  "headerGap": 4,
  "padding": 18,
  "chipCount": 2,
  "showExpand": true,
  "showClose": true
}/*EDITMODE-END*/;

// Global tweaks store — lives at App level, threaded down to every overlay.
// We stash the live values on window so scene components deep in the tree
// can read without prop-drilling through DesignCanvas.
window.__handyTweaks = TWEAK_DEFAULTS;

// ──────────────────────────────────────────────
// Phone frame (our own minimal version — cleaner than the starter's
// Material-green styling, so the glass reads without competing colors)
// ──────────────────────────────────────────────
function Phone({ children, width = 360, height = 740, time = "9:41", darkStatus = false }) {
  return (
    <div style={{
      width, height,
      borderRadius: 44,
      background: "#0d0d10",
      padding: 10,
      boxShadow: "0 30px 80px -20px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.04) inset",
      position: "relative",
    }}>
      <div style={{
        width: "100%", height: "100%",
        borderRadius: 36,
        overflow: "hidden",
        position: "relative",
        background: "#000",
      }}>
        {/* Status bar */}
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, height: 36,
          display: "flex", alignItems: "center", justifyContent: "space-between",
          padding: "0 24px", zIndex: 100,
          color: darkStatus ? "#111" : "#fff", fontFamily: "'Inter', sans-serif",
          fontSize: 13, fontWeight: 600,
        }}>
          <span>{time}</span>
          {/* Camera pill */}
          <div style={{
            position: "absolute", left: "50%", top: 8, transform: "translateX(-50%)",
            width: 90, height: 24, borderRadius: 999, background: "#000",
          }} />
          <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
            {/* Signal */}
            <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
              <rect x="0" y="8" width="2.5" height="3" rx="0.5" fill="currentColor" />
              <rect x="3.5" y="6" width="2.5" height="5" rx="0.5" fill="currentColor" />
              <rect x="7" y="3" width="2.5" height="8" rx="0.5" fill="currentColor" />
              <rect x="10.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" />
            </svg>
            {/* Wifi */}
            <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
              <path d="M7.5 10a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6Z" fill="currentColor" />
              <path d="M3.3 6.2A5.8 5.8 0 0 1 11.7 6.2" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
              <path d="M0.5 3.5a10 10 0 0 1 14 0" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
            </svg>
            {/* Battery */}
            <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
              <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" opacity="0.5" />
              <rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor" />
              <rect x="23.5" y="4" width="1.5" height="4" rx="0.5" fill="currentColor" opacity="0.5" />
            </svg>
          </div>
        </div>
        {children}
      </div>
    </div>
  );
}

// ──────────────────────────────────────────────
// Scenes
// ──────────────────────────────────────────────

function WidgetStatesScene({ theme }) {
  const states = [
    { id: "idle",      label: "Idle" },
    { id: "hover",     label: "Hover" },
    { id: "listening", label: "Listening" },
    { id: "thinking",  label: "Thinking" },
  ];
  return (
    <div style={{
      padding: "40px 32px",
      background: theme.pageBg,
      minHeight: "100%",
      fontFamily: HANDY_FONT,
    }}>
      <div style={{
        display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16,
      }}>
        {states.map(s => (
          <div key={s.id} style={{
            borderRadius: 20,
            padding: "28px 12px 16px",
            background: `radial-gradient(80% 60% at 50% 30%, rgba(120, 60, 200, 0.3), transparent 70%), #18141f`,
            display: "flex", flexDirection: "column", alignItems: "center", gap: 16,
            border: `0.5px solid ${theme.divider}`,
          }}>
            <FloatingWidget theme={theme} state={s.id} size={64} />
            <div style={{ fontSize: 11, color: theme.textSecondary, fontWeight: 500, letterSpacing: 0.3, textTransform: "uppercase" }}>
              {s.label}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function WidgetOnHomeScene({ theme, state = "idle" }) {
  return (
    <Phone>
      <HomeScreenBackdrop />
      {/* Widget positioned at right edge */}
      <div style={{ position: "absolute", top: 280, right: 14, zIndex: 50 }}>
        <FloatingWidget theme={theme} state={state}
                         label={state === "listening" ? "Listening…" :
                                state === "thinking" ? "Thinking…" : null} size={56} />
      </div>
      {/* Nav bar */}
      <div style={{ position: "absolute", bottom: 6, left: 0, right: 0, height: 16,
                    display: "flex", justifyContent: "center", alignItems: "center" }}>
        <div style={{ width: 120, height: 4, borderRadius: 2, background: "#fff", opacity: 0.5 }} />
      </div>
    </Phone>
  );
}

function OverlayOnHomeScene({ theme, tweaks }) {
  return (
    <Phone>
      <HomeScreenBackdrop />
      <div style={{ position: "absolute", bottom: 28, left: 0, right: 0 }}>
        <ChatOverlay theme={theme} context="home" tweaks={tweaks} />
      </div>
      <div style={{ position: "absolute", bottom: 6, left: 0, right: 0, height: 16,
                    display: "flex", justifyContent: "center", alignItems: "center" }}>
        <div style={{ width: 120, height: 4, borderRadius: 2, background: "#fff", opacity: 0.5 }} />
      </div>
    </Phone>
  );
}

function OverlayOnPhotosScene({ theme, tweaks }) {
  return (
    <Phone>
      <PhotosAppBackdrop />
      <div style={{ position: "absolute", bottom: 28, left: 0, right: 0 }}>
        <ChatOverlay theme={theme} context="photos" tweaks={tweaks} />
      </div>
      <div style={{ position: "absolute", bottom: 6, left: 0, right: 0, height: 16,
                    display: "flex", justifyContent: "center", alignItems: "center" }}>
        <div style={{ width: 120, height: 4, borderRadius: 2, background: "#fff", opacity: 0.5 }} />
      </div>
    </Phone>
  );
}

function OverlayOnMapScene({ theme, tweaks }) {
  return (
    <Phone>
      <MapAppBackdrop />
      <div style={{ position: "absolute", bottom: 28, left: 0, right: 0 }}>
        <ChatOverlay theme={theme} context="map" tweaks={tweaks} />
      </div>
      <div style={{ position: "absolute", bottom: 6, left: 0, right: 0, height: 16,
                    display: "flex", justifyContent: "center", alignItems: "center" }}>
        <div style={{ width: 120, height: 4, borderRadius: 2, background: "#fff", opacity: 0.5 }} />
      </div>
    </Phone>
  );
}

function OverlayOnLightAppScene({ theme, tweaks }) {
  return (
    <Phone darkStatus>
      <LightDocAppBackdrop />
      <div style={{ position: "absolute", bottom: 28, left: 0, right: 0 }}>
        <ChatOverlay theme={theme} context="home" tweaks={tweaks} />
      </div>
      <div style={{ position: "absolute", bottom: 6, left: 0, right: 0, height: 16,
                    display: "flex", justifyContent: "center", alignItems: "center" }}>
        <div style={{ width: 120, height: 4, borderRadius: 2, background: "#1A1A1F", opacity: 0.45 }} />
      </div>
    </Phone>
  );
}

function FullAppScene({ theme, state }) {
  return (
    <Phone>
      <FullChatApp theme={theme} state={state} />
      <div style={{ position: "absolute", bottom: 6, left: 0, right: 0, height: 16,
                    display: "flex", justifyContent: "center", alignItems: "center" }}>
        <div style={{ width: 120, height: 4, borderRadius: 2, background: "#fff", opacity: 0.5 }} />
      </div>
    </Phone>
  );
}

function SettingsScene({ theme }) {
  return (
    <Phone>
      <SettingsScreen theme={theme} />
      <div style={{ position: "absolute", bottom: 6, left: 0, right: 0, height: 16,
                    display: "flex", justifyContent: "center", alignItems: "center" }}>
        <div style={{ width: 120, height: 4, borderRadius: 2, background: "#fff", opacity: 0.5 }} />
      </div>
    </Phone>
  );
}

function PermissionsScene({ theme }) {
  return (
    <Phone>
      <PermissionsScreen theme={theme} />
      <div style={{ position: "absolute", bottom: 6, left: 0, right: 0, height: 16,
                    display: "flex", justifyContent: "center", alignItems: "center" }}>
        <div style={{ width: 120, height: 4, borderRadius: 2, background: "#fff", opacity: 0.5 }} />
      </div>
    </Phone>
  );
}

// (sections built inline as JSX below)

function Cover({ theme, label }) {
  return (
    <div style={{
      padding: "40px 36px",
      background: theme.pageBg,
      color: theme.textPrimary,
      fontFamily: HANDY_FONT,
      height: "100%",
      display: "flex", flexDirection: "column", justifyContent: "space-between",
      backgroundImage: `radial-gradient(60% 40% at 20% 10%, ${theme.accent}22, transparent 60%),
                       radial-gradient(50% 40% at 90% 90%, ${theme.accent}18, transparent 60%)`,
    }}>
      <div>
        <div style={{ fontSize: 11, letterSpacing: 2, color: theme.accent, fontWeight: 600, textTransform: "uppercase" }}>
          Handy · Bold direction
        </div>
        <div style={{ fontSize: 44, fontWeight: 700, letterSpacing: -1.2, lineHeight: 1.05, marginTop: 10 }}>
          Warm amber,{"\n"}present and inviting.
        </div>
        <div style={{ fontSize: 14, color: theme.textSecondary, marginTop: 16, maxWidth: 340, lineHeight: 1.5 }}>
          Near-black glass with a warm amber accent that echoes the hand. One font, varied weights. One accent, everything else neutral.
        </div>
      </div>
      <div style={{ display: "flex", gap: 18, alignItems: "center" }}>
        <FloatingWidget theme={theme} state="idle" size={56} />
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <Swatch color={theme.pageBg} label="Ink" />
            <Swatch color={theme.accent} label="Accent" />
            <Swatch color={theme.textPrimary} label="Text" />
            <Swatch color={theme.textSecondary} label="Muted" border />
          </div>
          <div style={{ fontSize: 11, color: theme.textMuted, marginTop: 10 }}>
            Inter · 400 / 500 / 600 / 700 — single family, varied weights
          </div>
        </div>
      </div>
    </div>
  );
}

function Swatch({ color, label, border }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
      <div style={{
        width: 34, height: 34, borderRadius: 8, background: color,
        border: border ? "0.5px solid rgba(255,255,255,0.2)" : "none",
      }} />
      <div style={{ fontSize: 10, color: "rgba(255,255,255,0.55)" }}>{label}</div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = HandyThemes.bold;
  // Expose live tweaks globally for any scene
  window.__handyTweaks = t;
  return (
    <>
    <DesignCanvas>
      <DCSection id="intro" title="Handy — Android Redesign" subtitle="Bold direction · warm amber, near-black glass">
        <DCArtboard id="cover" label="Direction overview" width={600} height={420}>
          <Cover theme={theme} />
        </DCArtboard>
      </DCSection>

      <DCSection id="onboarding" title="Onboarding" subtitle="First-run permissions">
        <DCArtboard id="P1" label="00 — Permissions" width={360} height={740}>
          <PermissionsScene theme={theme} />
        </DCArtboard>
      </DCSection>

      <DCSection id="widget" title="Floating widget" subtitle="Idle · Hover · Listening · Thinking">
        <DCArtboard id="W1" label="01 — Four states" width={760} height={300}>
          <WidgetStatesScene theme={theme} />
        </DCArtboard>
        <DCArtboard id="W2" label="02 — Idle on home" width={360} height={740}>
          <WidgetOnHomeScene theme={theme} state="idle" />
        </DCArtboard>
        <DCArtboard id="W3" label="03 — Listening on home" width={360} height={740}>
          <WidgetOnHomeScene theme={theme} state="listening" />
        </DCArtboard>
      </DCSection>

      <DCSection id="overlay" title="Chat overlay" subtitle="Quick-chat glass card on any screen · tweakable">
        <DCArtboard id="O1" label="04 — Overlay on Home" width={360} height={740}>
          <OverlayOnHomeScene theme={theme} tweaks={t} />
        </DCArtboard>
        <DCArtboard id="O2" label="05 — Overlay on Photos" width={360} height={740}>
          <OverlayOnPhotosScene theme={theme} tweaks={t} />
        </DCArtboard>
        <DCArtboard id="O3" label="06 — Overlay on Maps" width={360} height={740}>
          <OverlayOnMapScene theme={theme} tweaks={t} />
        </DCArtboard>
        <DCArtboard id="O4" label="07 — Overlay on light app (Docs)" width={360} height={740}>
          <OverlayOnLightAppScene theme={theme} tweaks={t} />
        </DCArtboard>
      </DCSection>

      <DCSection id="fullapp" title="Full Handy app" subtitle="The maximised chat view">
        <DCArtboard id="F1" label="07 — Empty state" width={360} height={740}>
          <FullAppScene theme={theme} state="empty" />
        </DCArtboard>
        <DCArtboard id="F2" label="08 — In conversation" width={360} height={740}>
          <FullAppScene theme={theme} state="chat" />
        </DCArtboard>
      </DCSection>

      <DCSection id="settings" title="Settings" subtitle="Brain (with inline keys) · Modes · Triggers · Web tools">
        <DCArtboard id="S1" label="09 — Settings" width={360} height={740}>
          <SettingsScene theme={theme} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>

    <TweaksPanel title="Overlay tweaks">
      <TweakSection label="Header">
        <TweakSlider label="Hand icon size" value={t.handSize} min={14} max={40} unit="px"
                     onChange={(v) => setTweak('handSize', v)} />
        <TweakSlider label="Title size" value={t.titleSize} min={14} max={28} unit="px"
                     onChange={(v) => setTweak('titleSize', v)} />
        <TweakSlider label="Subtitle size" value={t.subtitleSize} min={10} max={18} unit="px"
                     onChange={(v) => setTweak('subtitleSize', v)} />
        <TweakSlider label="Title → subtitle gap" value={t.headerGap} min={0} max={14} unit="px"
                     onChange={(v) => setTweak('headerGap', v)} />
      </TweakSection>
      <TweakSection label="Layout">
        <TweakSlider label="Card padding" value={t.padding} min={10} max={28} unit="px"
                     onChange={(v) => setTweak('padding', v)} />
        <TweakSlider label="Chip count" value={t.chipCount} min={0} max={3}
                     onChange={(v) => setTweak('chipCount', v)} />
        <TweakToggle label="Show expand button" value={t.showExpand}
                     onChange={(v) => setTweak('showExpand', v)} />
        <TweakToggle label="Show close button" value={t.showClose}
                     onChange={(v) => setTweak('showClose', v)} />
      </TweakSection>
    </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
